version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: skinsafe-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skinsafe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skinsafe_secret}
      POSTGRES_DB: ${POSTGRES_DB:-skinsafe_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skinsafe_user} -d ${POSTGRES_DB:-skinsafe_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skinsafe-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://skinsafe_user:skinsafe_secret@db:5432/skinsafe_db
      - JWT_SECRET_KEY=supersecretjwtkey_change_in_production_skinsafe2026
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=43200
      - AI_PROVIDER=gemini
      - AI_API_KEY=${AI_API_KEY:-}
      - CORS_ORIGINS=*
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

volumes:
  postgres_data:
